name: de07-web-lb-cluster

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.240.0/24
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  mysql_data:

services:
  lb01:
    image: nginx:1.27-alpine
    container_name: de07-lb01
    networks:
      frontend:
        ipv4_address: 192.168.240.10
      backend:
        ipv4_address: 172.20.0.10
    ports:
      - "${LB_HTTP_PORT:-8080}:80"
      - "${LB_HTTPS_PORT:-8443}:443"
    environment:
      LB_ALGO_DIRECTIVE: "${LB_ALGO_DIRECTIVE:-least_conn;}"
      MAX_FAILS: "${MAX_FAILS:-2}"
      FAIL_TIMEOUT: "${FAIL_TIMEOUT:-10s}"
      BACKEND_PORT: "80"
    volumes:
      - ./nginx/lb/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/lb/templates:/etc/nginx/templates:ro
      - ./nginx/lb/certs:/etc/nginx/certs:ro
    depends_on:
      - web01
      - web02
      - web03
    restart: unless-stopped

  web01:
    build: ./web
    container_name: de07-web01
    hostname: web01
    networks:
      backend:
        ipv4_address: 172.20.0.11
    environment:
      NODE_NAME: web01
      DB_HOST: mysql01
      DB_PORT: "3306"
      DB_NAME: de07_web
      DB_USER: webapp
      DB_PASSWORD: "${DB_PASSWORD:-WebAppPass0}"
      REDIS_HOST: redis01
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-RedisPass0}"
      SESSION_STORE: "${SESSION_STORE:-redis}"

  web02:
    build: ./web
    container_name: de07-web02
    hostname: web02
    networks:
      backend:
        ipv4_address: 172.20.0.12
    environment:
      NODE_NAME: web02
      DB_HOST: mysql01
      DB_PORT: "3306"
      DB_NAME: de07_web
      DB_USER: webapp
      DB_PASSWORD: "${DB_PASSWORD:-WebAppPass0}"
      REDIS_HOST: redis01
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-RedisPass0}"
      SESSION_STORE: "${SESSION_STORE:-redis}"

  web03:
    build: ./web
    container_name: de07-web03
    hostname: web03
    networks:
      backend:
        ipv4_address: 172.20.0.13
    environment:
      NODE_NAME: web03
      DB_HOST: mysql01
      DB_PORT: "3306"
      DB_NAME: de07_web
      DB_USER: webapp
      DB_PASSWORD: "${DB_PASSWORD:-WebAppPass0}"
      REDIS_HOST: redis01
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-RedisPass0}"
      SESSION_STORE: "${SESSION_STORE:-redis}"

  redis01:
    image: redis:7-alpine
    container_name: de07-redis01
    networks:
      backend:
        ipv4_address: 172.20.0.20
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-RedisPass0}"
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisPass0}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql01:
    image: mariadb:11.4
    container_name: de07-mysql01
    networks:
      backend:
        ipv4_address: 172.20.0.30
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-RootPass0}"
      MARIADB_DATABASE: de07_web
      MARIADB_USER: webapp
      MARIADB_PASSWORD: "${DB_PASSWORD:-WebAppPass0}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  client01:
    build: ./client
    container_name: de07-client01
    networks:
      frontend:
        ipv4_address: 192.168.240.20
    profiles: ["tools"]
    volumes:
      - ./scripts:/scripts:ro
      - ./results:/results
    environment:
      LB_HOST: 192.168.240.10
      LB_HTTPS_PORT: "443"
    command: ["sleep", "infinity"]
