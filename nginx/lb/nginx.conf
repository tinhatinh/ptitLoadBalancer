user  nginx;
worker_processes  auto;
pid  /var/run/nginx.pid;

error_log  /var/log/nginx/error.log  warn;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65s;

    # Log of record: ghi lai node nao phuc vu tung request. Day la bang chung
    # dung cho kiem thu phan phoi tai va failover.
    log_format  lb_trace  '$remote_addr - [$time_local] "$request" '
                          'status=$status upstream=$upstream_addr '
                          'upstream_status=$upstream_status '
                          'upstream_time=$upstream_response_time '
                          'req_time=$request_time xff="$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  lb_trace;

    # Zone danh theo IP nguoi dung, dung cho /login va /ratelimit-probe.
    limit_req_zone   $binary_remote_addr  zone=auth:10m   rate=5r/s;
    limit_req_zone   $binary_remote_addr  zone=probe:10m  rate=5r/s;
    limit_req_status 429;

    # Zone danh theo IP nguoi dung cho kich ban DoS ung dung.
    limit_conn_zone  $binary_remote_addr  zone=perip:10m;

    include /etc/nginx/conf.d/*.conf;
}
