pid        /run/nginx/nginx.pid;
daemon     off;
worker_processes  2;

error_log  /var/log/nginx/error.log  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;

    # Node chi nam sau load balancer. Khong dung set_real_ip_from o day:
    # module realip chay o giai doan preaccess TRUOC module access, nen neu
    # no ghi de $remote_addr thi moi quy tac allow/deny ben duoi se bi
    # danh gia theo dia chi lay tu X-Forwarded-For, tuc la theo du lieu ma
    # nguoi goi tu soan ra. IP khach hang that di qua header X-Real-IP do
    # load balancer gan vao va chi dung de log va ghi nhat ky.
    log_format  node_trace  'peer=$remote_addr client="$http_x_real_ip" '
                            '"$time_iso8601" "$request" '
                            'status=$status node=@NODE_NAME@ '
                            'ua="$http_user_agent" xff="$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  node_trace;

    # IP khach hang de PHP ghi nhat ky: lay tu X-Real-IP do load balancer
    # gan vao, fallback ve dia chi peer khi goi noi bo khong qua LB. Khai
    # bao nam sau `include fastcgi_params` o tung location, vi fastcgi_param
    # o muc duoi se khong ke thua khi muc tren da co danh sach cua no.
    map $http_x_real_ip $client_addr {
        default        $http_x_real_ip;
        ""             $remote_addr;
    }

    server {
        listen       80 default_server;
        server_name  _;
        root         /var/www/public;
        index        index.php;

        # Node chi phuc vu load balancer. Day la muc phan ung dung, khong
        # phai quy tac tuong lua o hat nhan: no khong thay duoc goi TCP bi
        # chan o tang 3/4, nhung no chan duoc dieu ma phep do truoc day ghi
        # nhan la mo - mot container khac trong cung mang backend goi thang
        # toi node thi node tra loi 200.
        allow 172.20.0.10;      # lb01
        allow 127.0.0.1;        # kiem tra noi bo trong chinh container
        deny  all;

        add_header X-Node "@NODE_NAME@" always;

        # An header ban quyen cua PHP va cac fingerprint khong can thiet.
        fastcgi_hide_header  X-Powered-By;

        # Diem kiem tra suc khoe. Goi thang fastcgi thay vi try_files de
        # tranh truong hop try_files tim thay file roi phat nguoc ra ma
        # nguon PHP thay vi chay no.
        location = /healthz {
            include             /etc/nginx/fastcgi_params;
            fastcgi_param       SCRIPT_FILENAME /var/www/public/healthz.php;
            fastcgi_param       SCRIPT_NAME     /healthz.php;
            fastcgi_param       DOCUMENT_URI    /healthz.php;
            fastcgi_param       QUERY_STRING    "";
            fastcgi_param       REMOTE_ADDR     $client_addr;
            fastcgi_pass        127.0.0.1:9000;
        }

        # Chan file cau hinh va file an. location = co uu tien cao hon moi
        # regex nen no thang hon block xu ly .php ben duoi; neu dung regex
        # ^/(config\.php) thi no dat SAU `~ \.php$` va khong bao gio chay.
        location = /config.php {
            deny all;
            access_log off;
        }

        location ~ /\. {
            deny all;
            access_log off;
        }

        location ~ \.php$ {
            try_files      $uri =404;
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  DOCUMENT_ROOT   /var/www/public;
            fastcgi_param  REMOTE_ADDR     $client_addr;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
        }

        # Thu vien rieng cua ung dung, khong duoc goi truc tiep.
        location ^~ /lib/ {
            deny all;
            return 403;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }
    }
}
